# HOW A `java.*` CLASS GETS FOUND, AND WHY THAT MATTERS HERE
# =========================================================
#
# ClasspathResourceMapper.apply(name) tries, in order:
#
#   1. classMappings   -- the mapClass| lines above
#   2. packageMappings -- package rewrites, then prefixMapping inserts the T
#   3. innerMapper     -- a plain ClassLoader.getResource(name.replace('.','/')+".class")
#
# Step 2 is what makes the classlib work. teavm-classlib ships
#
#   mapPackageHierarchy|org.teavm.classlib.java=java
#   stripPrefixFromPackageHierarchyClasses|org.teavm.classlib.java=T
#
# so packageMappings turns the requested public name `java.util.concurrent.Future`
# into `org.teavm.classlib.java.util.concurrent.TFuture`, which step 3 *can*
# read from a jar. The exclusion `includePackageHierarchy|java=false` only
# guards step 3, so it never hides the classlib from itself.
#
# Step 3 is also where the host JDK lives. For any `java.*` or `javax.*` name
# the bootstrap loader answers getResource out of the running JDK's module
# image (verified: `jrt:/java.base/java/util/concurrent/CompletableFuture.class`),
# so a jar on the classpath is never even consulted. Adding
# `includePackageHierarchy|java=true` to work around that does not "re-open"
# the package -- it hands step 3 to the JDK. TeaVM then compiles the *real*
# java.util.concurrent.CompletableFuture, ForkJoinPool, VarHandle, sun.misc.Unsafe,
# jdk.internal.vm.ThreadContainers and java.lang.management.ManagementFactory,
# none of which survive TeaVM's backend, while the jdk-shims jar sits unread.
#
# So the java.* hierarchy is left exactly as the classlib ships it, and the
# shims are relocated into the namespace step 2 looks in
# (jdk-shims/tools/ShimRelocator.java). Nothing below re-enables java.*.
#
# `javax.*` needs the same treatment. The classlib excludes only `java` and
# `javax.xml`, so every other javax.* name also falls through to step 3 and
# currently resolves to the host JDK -- which is how javax.management.* drags in
# java.lang.management, and javax.naming.* drags in java.naming. The three lines
# below mirror the classlib's own java.* setup for javax.*, closing the JDK
# fallback: a javax.* class is now found only if we ship it.
includePackageHierarchy|javax=false
mapPackageHierarchy|javax=org.teavm.classlib.javax
stripPrefixFromPackageHierarchyClasses|org.teavm.classlib.javax=T
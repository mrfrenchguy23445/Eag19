name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch -- a full :compileJava is several
# minutes of CPU, so stale runs are not worth finishing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The committed wrapper JAR and properties must match, otherwise a clone can
  # silently build with a different Gradle than the one the project was tested
  # against. This runs in seconds and catches a tampered or stale wrapper.
  wrapper-validation:
    name: Gradle wrapper validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  build:
    name: Compile merged 1.19.4 tree
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # MUST be 17. The build pins a Java 17 toolchain and settings.gradle.kts
      # declares no toolchain resolver, so Gradle will not provision it -- a
      # runner defaulting to a newer JDK fails with
      # "No matching toolchain found for language version 17".
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # Only the root subproject is compiled here. The merged game tree is the
      # part that must stay buildable.
      #
      # Deliberately NOT building target_teavm_javascript or
      # target_lwjgl_desktop: both compile sources that call
      # net.minecraft.client.main.Main.appMain(), which does not exist in the
      # 1.19.4 tree. They are broken at HEAD -- see "Port status" in README.md.
      # Wiring CI to them before appMain() is reintroduced would just produce a
      # permanently red build and train everyone to ignore it.
      - name: Compile
        run: ./gradlew :compileJava --console=plain

      - name: Upload compiler logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compile-logs
          path: build/**/*.log
          if-no-files-found: ignore
          retention-days: 7
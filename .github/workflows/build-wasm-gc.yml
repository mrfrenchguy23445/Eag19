name: Build WASM-GC (TeaVM)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build WASM-GC
        run: ./gradlew :target_teavm_wasm_gc:buildWasmGC --no-build-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.configureondemand=false -Dorg.gradle.jvmargs=-Xmx6g"

      - name: List output files
        run: ls -la target_teavm_wasm_gc/javascript/ target_teavm_wasm_gc/javascript_dist/ target_teavm_wasm_gc/classes.wasm 2>&1 | head -60

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: eaglercraft-wasm-gc
          path: |
            target_teavm_wasm_gc/classes.wasm
            target_teavm_wasm_gc/javascript/
            target_teavm_wasm_gc/javascript_dist/
          if-no-files-found: error

// Prints the root project's main runtimeClasspath between CPSTART/CPEND markers,
// so scripts/verify-profile.sh can build a runnable classpath.
//
// UUIDUtil's static initialiser references DataFixerUpper's Codec, so a
// verifier cannot run against build/classes/java/main alone.
allprojects {
	tasks.register("printRuntimeCp") {
		doLast {
			if (project.plugins.hasPlugin("java")) {
				println "CPSTART" + project.sourceSets.main.runtimeClasspath.asPath + "CPEND"
			}
		}
	}
}